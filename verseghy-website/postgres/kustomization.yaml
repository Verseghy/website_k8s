# Image Updater follows the PostgreSQL 18 minor releases with its semver
# strategy (verseghy-website/image-updater/imageupdater.yaml), as it does for
# mysql. The tag is not pinned by digest here: with the semver strategy, Image
# Updater 1.3 writes tags only, and it treats a running tag@digest as
# different from the same tag, so it would open a PR that drops the digest.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - configmap.yaml
  - deployment.yaml
  - persistentvolumeclaim.yaml
  - service.yaml
images:
  - name: postgres
    newTag: "18.6"
    newName: postgres
