apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
data:
  # The server reads this file through its hba_file setting
  # (deployment.yaml), not the copy that initdb writes into the data
  # directory. The first matching line wins. The server reads the file at
  # start and on reload, so after a change here run SELECT pg_reload_conf()
  # as the superuser, or restart the pod.
  pg_hba.conf: |
    # TYPE  DATABASE  USER               ADDRESS  METHOD
    # The metrics exporter in the same pod: over the Unix socket, which only
    # the pod's containers can reach, to the verseghy database, without a
    # password. Its role is read-only and holds only pg_monitor.
    local   verseghy  postgres_exporter           trust
    # Everyone else: a SCRAM password, over the socket (an operator in the
    # pod, with the superuser's password from $POSTGRES_PASSWORD) and over TCP
    # (backend3 and its jobs through the Service).
    local   all       all                         scram-sha-256
    host    all       all                all      scram-sha-256
  # The image runs this once, when it initialises an empty data directory,
  # as the superuser over the Unix socket. It never runs again, so editing it
  # changes nothing in an existing database.
  10-roles.sh: |
    #!/bin/bash
    set -Eeuo pipefail

    # The format that backend-secrets documents for database passwords, so
    # the password goes into backend3's DATABASE_URL without escaping.
    if [[ ! "${POSTGRES_WEBSITE_BACKEND3_PASSWORD:-}" =~ ^[A-Za-z0-9]{32,}$ ]]; then
      echo "10-roles.sh: POSTGRES_WEBSITE_BACKEND3_PASSWORD (backend-secrets key" \
        "postgres-website_backend3-password) must be at least 32 letters and" \
        "digits. Fix the 1Password item postgres-website_backend3. initdb has" \
        "already run, so the next start skips this script: create the roles and" \
        "the database below by hand, or initialise the still empty data" \
        "directory again." >&2
      exit 1
    fi

    # The password reaches psql through the environment (\getenv), never as
    # a command-line argument. Empty PGHOST and PGHOSTADDR: the Unix socket.
    PGHOST='' PGHOSTADDR='' psql -v ON_ERROR_STOP=1 --no-psqlrc --no-password \
      --username "$POSTGRES_USER" --dbname postgres <<'EOSQL'
    \getenv website_backend3_password POSTGRES_WEBSITE_BACKEND3_PASSWORD
    -- backend3's own role. It owns the database, so it runs the migrations,
    -- which create the unaccent extension (trusted) and the hu_icu collation.
    CREATE ROLE website_backend3 WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
      NOREPLICATION NOBYPASSRLS PASSWORD :'website_backend3_password';
    CREATE DATABASE verseghy OWNER website_backend3;
    REVOKE ALL ON DATABASE verseghy FROM PUBLIC;

    -- The metrics exporter: statistics only, read-only, no password (see
    -- pg_hba.conf).
    CREATE ROLE postgres_exporter WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE
      NOREPLICATION NOBYPASSRLS CONNECTION LIMIT 3;
    GRANT pg_monitor TO postgres_exporter;
    GRANT CONNECT ON DATABASE verseghy TO postgres_exporter;
    ALTER ROLE postgres_exporter SET default_transaction_read_only = on;
    EOSQL
