# refreshInterval is how often, in seconds, ESO checks this store again after
# a successful check. Without it the controller's default applies: every
# 5 minutes (the --store-requeue-interval flag, which the chart pinned in
# microshift-infra/applications/eso.yaml leaves at its default). With the
# 1Password SDK provider of ESO 0.20.4, every check creates a new SDK client
# and lists the vaults twice. By an estimate from the code, a Ready store
# makes about 580 vault listings a day at the default and about 53 at 3600;
# both figures include the 2 to 3 extra checks a day from the controller's
# 10-hour cache resync. 1Password caps the requests of a whole 1Password
# account per day, across all of its service accounts.
#
# It does not change how a failing check is retried: ESO retries it with its
# back-off (1 s, doubling up to 7 minutes), whatever this value, so the store
# turns Ready again within minutes after 1Password answers again. A Ready
# store that breaks later (a revoked token, a renamed vault) shows as Degraded
# only at its next check, up to an hour later. A change to the store, a change
# of its Ready condition, or a controller restart also triggers a check at
# once.
#
# The edge's other store, microshift-infra/router-certs/secretstore.yaml, uses
# the same value. Check both again after an ESO upgrade, as the cost of a
# check depends on the ESO version.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
spec:
  refreshInterval: 3600
  provider:
    onepasswordSDK:
      vault: Verseghy
      auth:
        serviceAccountSecretRef:
          name: onepassword-connect-token-verseghy
          key: token
