# refreshInterval is how often, in seconds, ESO checks this store again after
# a successful check. Without it the controller's default applies: every
# 5 minutes (the --store-requeue-interval flag, which the chart pinned in
# microshift-infra/applications/eso.yaml leaves at its default).
#
# With the 1Password SDK provider of ESO 2.5.0, a check makes no 1Password
# request. The check itself calls nothing (since external-secrets v1.0.0),
# and the controller keeps one SDK client per store in memory (since v2.1.0)
# and reuses it while the store's resourceVersion stays the same. A new
# client, which signs in and lists the vaults once, is made only after a
# controller restart, a change to this store, or a change of its Ready
# condition. So the value no longer saves 1Password requests; 3600 is kept
# because it cuts each store's status patch requests and "store validated"
# events on the small edge node from about 290 to about 26 a day (both
# figures include the controller's 10-hour cache resync). The 1Password
# requests are spent by the ExternalSecrets' refreshes: one SDK Resolve call
# per entry at each refresh (externalsecret.yaml). How many HTTP requests one
# call makes is decided inside the SDK, so this is a count of calls, not of
# requests. 1Password caps the requests of a whole 1Password account per day,
# across all of its service accounts.
#
# Because a check calls nothing, a Ready store does not notice when it breaks
# later (a revoked token, a renamed vault, a 1Password outage): it stays
# Ready, and the failure shows only on its ExternalSecrets (SecretSyncedError)
# at their next refresh or forced sync. A check that fails, for example when
# a new client cannot sign in, is retried with ESO's back-off (1 s, doubling
# up to 7 minutes) whatever this value.
#
# The cached client also keeps the token it signed in with. After rotating
# the token in the Secret onepassword-connect-token-verseghy, restart the
# controller so that it reads the new one:
#   oc rollout restart -n external-secrets deployment/microshift-infra-eso-operator-external-secrets
#
# The edge's other store, microshift-infra/router-certs/secretstore.yaml, uses
# the same value. Check both again after an ESO upgrade, as the cost of a
# check depends on the ESO version.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
spec:
  refreshInterval: 3600
  provider:
    onepasswordSDK:
      vault: Verseghy
      auth:
        serviceAccountSecretRef:
          name: onepassword-connect-token-verseghy
          key: token
