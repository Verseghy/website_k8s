# backend-secrets is the one Secret that the website's workloads on the edge
# share: backend, mysql and backend2, and backend3 with its PostgreSQL. Each
# workload reads single keys with secretKeyRef, never the whole Secret with
# envFrom. Every key comes from its own item in the Verseghy 1Password vault
# (`key: <item>/<field>` below), so no value is ever in Git.
#
# The Secret syncs all or nothing. With the 1Password SDK provider of ESO
# 0.20.4 (the chart version in microshift-infra/applications/eso.yaml), an
# entry whose item or field cannot be resolved fails the whole sync: the
# ExternalSecret goes to SecretSyncedError, the Secret keeps its last values,
# and no key refreshes, not even after a forced refresh, which a credential
# rotation depends on. The failing sync is also retried with back-off, and
# each retry spends 1Password requests. Setting deletionPolicy to Delete or
# Merge would not help: this provider does not report a missing item as
# ESO's "no secret" error, which those policies need before they skip an
# entry, so no entry can be made optional. Therefore:
#   - create an entry's 1Password item before the PR that adds the entry
#     merges (Argo CD applies a merged change to the spec, such as a new
#     entry, at once, and ESO then fetches every key again);
#   - never delete or rename an item while its entry is here: remove the entry
#     in a PR that merges first, then delete the item;
#   - check this behaviour again after an ESO upgrade.
#
# The 24h refreshInterval keeps 1Password API use low. After changing a value
# in 1Password, force a refresh instead of waiting:
#   oc annotate -n verseghy externalsecret backend-secrets force-sync=$(date +%s) --overwrite
# and restart the consumers, because pods read the Secret only at start. A
# database password must also be changed in the database itself, and
# backend3's TOTP and content MAC keys need backend3's own rotation
# procedure (see their entries).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    creationPolicy: Owner
  data:
    - secretKey: mysql-root-password
      remoteRef:
        key: mysql-root/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: app-key
      remoteRef:
        key: laravel-app-key/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: backpack-license
      remoteRef:
        key: backpack-license-key/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    - secretKey: mysql-website_backend2-password
      remoteRef:
        key: mysql-website_backend2/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # backend3 and its PostgreSQL. Their production values are used nowhere
    # else: staging has its own keys. Formats:
    #   - database passwords: at least 32 random letters and digits, so they go
    #     into connection URLs without escaping;
    #   - keys: random bytes in standard, padded base64 on a single line.
    #     decodingStrategy stays None: backend3 receives the base64 text and
    #     decodes it itself, so ESO must not decode it.
    # The PostgreSQL superuser's password, for initialising the database and
    # for maintenance. No application connects with it.
    - secretKey: postgres-admin-password
      remoteRef:
        key: postgres-admin/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # The password of backend3's own database role, website_backend3, which
    # backend3 and its CronJobs put into their DATABASE_URL.
    - secretKey: postgres-website_backend3-password
      remoteRef:
        key: postgres-website_backend3/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # Signs backend3's login tokens (HS512): at least 64 random bytes, base64.
    - secretKey: backend3-jwt-secret
      remoteRef:
        key: backend3-jwt/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # Encrypts the admins' stored TOTP secrets: at least 64 random bytes,
    # base64. It is a different value from the JWT secret, so a leak of one
    # does not expose the other. Once an admin has enrolled, replacing this
    # value alone is not a rotation: the stored TOTP secrets no longer
    # decrypt. Rotating it needs backend3's re-encrypt procedure, which reads
    # the old and the new key.
    - secretKey: backend3-totp-key
      remoteRef:
        key: backend3-totp-key/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # Signs and verifies backend3's stored rich text: at least 32 random bytes,
    # base64. Once backend3 holds content, replacing this value alone is not a
    # rotation: no stored body verifies any more, so backend3 falls back to
    # re-sanitising every body it serves until the content is re-tagged.
    # Rotating it needs backend3's procedure, which keeps the previous key
    # while the content is re-tagged.
    - secretKey: backend3-content-mac-key
      remoteRef:
        key: backend3-content-mac-key/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
    # The connection URL of the read-only MySQL account that backend3's
    # one-time import of the legacy data reads from, in the form
    # mysql://<account>:<password>@mysql.verseghy.svc.cluster.local/verseghy
    # with a password in the database format above. Outside the cut-over window
    # the 1Password value is the placeholder `disabled`, which backend3's
    # import task treats like an empty value: no import source is set. The
    # window sets the URL, runs the import and sets `disabled` again. The
    # entry stays, so that
    # backend3's reference to this key always resolves and its pods start;
    # removing it follows the rules at the top of this file.
    - secretKey: import-source-database-url
      remoteRef:
        key: import-source-database-url/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
