apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio
  namespace: verseghy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: verseghy
spec:
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
      initContainers:
        - name: bucket-creator
          image: public.ecr.aws/docker/library/alpine:latest
          command:
            - mkdir
            - -p
            - /data/prow-logs
            - /data/tide
            - /data/status-reconciler
          volumeMounts:
            - name: data
              mountPath: "/data"
      containers:
        - name: minio
          volumeMounts:
            - name: data
              mountPath: "/data"
          # MinIO Inc. deleted its public images from Docker Hub (2026-09-11) and quay.io
          # stopped serving quay.io/minio/minio anonymously (2026-09-24), which left this
          # pod in ImagePullBackOff and tide in CrashLoopBackOff. Chainguard still publishes
          # a community build, and the digest pin also makes kubelet reuse the cached image
          # instead of re-pulling "latest" on every restart.
          image: cgr.dev/chainguard/minio:latest@sha256:32c504bea4574d8f29d719b37bc0dad920ecf3e22b81dc5cea0bb105af2ce10f
          args:
            - server
            - /data
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root-creds
                  key: user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root-creds
                  key: password
            - name: MINIO_REGION_NAME
              value: minio
          ports:
            - containerPort: 9000
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            periodSeconds: 20
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: verseghy
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 9000
      protocol: TCP
  selector:
    app: minio
