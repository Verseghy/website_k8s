# The uploads copy (../data/uploads-persistentvolumeclaim.yaml), read-write at
# /data: the volume's root, whose app/public tree is what /storage serves. The
# import, when it runs in this pod, writes the images it extracts from post
# bodies there (storage_root /data/app/public). backend3 itself does not use
# the volume yet; the change that points its media settings at /data does.
# The volume is ReadWriteMany, so the rolling update's second pod can mount it
# on any node.
#
# fsGroupChangePolicy: the CephFS driver lets kubelet apply the pod's fsGroup
# to the volume, and with the default policy it walks every file of the copy
# at each pod start. OnRootMismatch does that only while the root's group does
# not match yet.
#
# When ../../backend3/deployment.yaml gets an uploads mount of its own, this
# patch goes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend3
spec:
  template:
    spec:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: backend3
          volumeMounts:
            - name: uploads
              mountPath: /data
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: backend-pv-claim
