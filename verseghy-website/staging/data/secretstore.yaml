# The 1Password vault Server, which holds staging's own items
# (verseghy-backend3-staging-*). Production's items are in the Verseghy vault,
# which nothing on the hub reads. Same provider and vault as the SecretStore
# of the hub's verseghy namespace (../../eso-in-cluster/secretstore.yaml); a
# SecretStore reads its token only from its own namespace, so this one needs
# its own copy.
#
# Before the first sync, by hand (Git never holds the token): create the
# Secret onepassword-connect-token, key token, in verseghy-website-staging,
# holding a 1Password service account token that can read the Server vault.
# 1Password rate-limits each service account, so a store that shares the
# verseghy namespace's token also shares its limit.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepasswordSDK:
      vault: Server
      auth:
        serviceAccountSecretRef:
          name: onepassword-connect-token
          key: token
