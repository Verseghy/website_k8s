# backend-secrets for staging: the Secret name and key names of the edge's
# (../../eso/externalsecret.yaml), so the reused manifests read it unchanged,
# but every value comes from a staging-only item in the Server vault. No
# production value is used on staging, and no staging value in production.
# The items exist already, each value in its password field, in production's
# formats: database passwords of at least 32 random letters and digits (they
# go into connection URLs without escaping), keys as random bytes in
# standard, padded base64 on one line. decodingStrategy stays None: backend3
# decodes the base64 text itself.
#
# Treat the Secret as syncing all or nothing, as the edge's does: an entry
# whose item cannot be read fails the whole sync, and no key refreshes. So
# create an item before the entry that reads it merges, and remove an entry
# before its item is deleted.
#
# The 24h refreshInterval keeps 1Password requests low. After changing a value
# in 1Password, force a refresh instead of waiting:
#   oc annotate -n verseghy-website-staging externalsecret backend-secrets force-sync=$(date +%s) --overwrite
# and restart the consumers, because pods read the Secret only at start. A
# database password must also be changed in the database itself, and the TOTP
# and content MAC keys need backend3's own rotation procedure once staging
# holds enrolled admins or content (see the edge's entries).
#
# The defaults that ESO fills in are written out, so that Argo CD does not
# report the object OutOfSync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # Merge: the Secret holds every key under data below, plus the keys
      # this template renders.
      mergePolicy: Merge
      data:
        # The import's source: the throwaway MySQL's own account
        # (mysql-deployment.yaml), in the form that the edge's key documents.
        # Unlike the edge, where it is `disabled` outside the cut-over window,
        # it is always set here, because rehearsals import at any time.
        import-source-database-url: 'mysql://backend3_import:{{ index . "mysql-import-password" }}@mysql.verseghy-website-staging.svc.cluster.local/verseghy'
  data:
    # The PostgreSQL superuser's password (Login item, username postgres), for
    # initialising the database and for maintenance; no application connects
    # with it.
    - secretKey: postgres-admin-password
      remoteRef:
        key: verseghy-backend3-staging-postgres-admin/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
    # backend3's own role, website_backend3 (Login item, username
    # website_backend3).
    - secretKey: postgres-website_backend3-password
      remoteRef:
        key: verseghy-backend3-staging-postgres-website_backend3/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
    # Signs backend3's login tokens: at least 64 random bytes, base64.
    - secretKey: backend3-jwt-secret
      remoteRef:
        key: verseghy-backend3-staging-jwt/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
    # Encrypts the admins' stored TOTP secrets: at least 64 random bytes,
    # base64, a different value from the JWT secret.
    - secretKey: backend3-totp-key
      remoteRef:
        key: verseghy-backend3-staging-totp-key/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
    # Signs and verifies backend3's stored rich text: at least 32 random
    # bytes, base64.
    - secretKey: backend3-content-mac-key
      remoteRef:
        key: verseghy-backend3-staging-content-mac-key/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
    # The password of backend3_import, the throwaway MySQL's account (Login
    # item, username backend3_import). The MySQL image reads it when it
    # creates the account; the template above puts it into the import URL.
    - secretKey: mysql-import-password
      remoteRef:
        key: verseghy-backend3-staging-mysql-import/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
