# backend's host. /storage on this host goes to the media server
# (verseghy-website/media/route-storage-legacyhost.yaml): its path is longer
# than this whole-host Route, so it wins for /storage. backend has no
# /storage Route of its own, on this host or on verseghy-gimnazium.net.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: backend
spec:
  host: backend.microshift.verseghy-gimnazium.net
  to:
    kind: Service
    name: backend-svc
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None