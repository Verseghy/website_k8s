apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: backend
      annotations:
        openshift.io/required-scc: anyuid
    spec:
      serviceAccount: anyuid
      # The backend-pv-claim volume is owned uid 1000, group 33 (dirs mode 775).
      # Run as uid 1000 to own its files, gid 0 for the base image's own group-0
      # writable dirs (bootstrap/cache, the public/storage symlink), and
      # supplemental gid 33 to create and unlink the volume's group-33 entries.
      # No fsGroup: it would recursively re-chown the ~3 GB volume on each mount.
      securityContext:
        runAsUser: 1000
        runAsGroup: 0
        supplementalGroups: [33]
      containers:
        - name: app
          image: ghcr.io/verseghy/website_backend:e53fd921d334285651b0634077db260f55ec0563
          ports:
            # The base's Apache listens on 8080 as a non-root user.
            - name: http
              containerPort: 8080
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: app-key
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: verseghy
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: mysql-root-password
            - name: BACKPACK_LICENSE
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: backpack-license
          # Probe a static file, not a PHP route: a web route writes a Laravel
          # session file to the volume on every poll.
          readinessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /robots.txt
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              # Also caps the s2i base's Apache worker count.
              memory: 512Mi
          volumeMounts:
            - mountPath: /opt/app-root/src/storage
              name: backend-persistent-storage
      volumes:
        - name: backend-persistent-storage
          persistentVolumeClaim:
            claimName: backend-pv-claim
