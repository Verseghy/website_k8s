# The defaults that the API server fills in from ESO 2.5.0's ExternalSecret
# CRD (the chart version in microshift-infra/applications/eso.yaml) are
# written out, so that Argo CD does not report the object OutOfSync. spec.data
# is an atomic list, in which a default that the server adds to an entry, such
# as nullBytePolicy (added in chart 2.3.0), shows as a difference.
#
# The CRDs before chart 2.3.0, 0.20.4 among them, have no nullBytePolicy, and
# Argo CD's strict field validation rejects it there: before the chart goes
# back to 0.20.4, revert this first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: SecretStore
    name: onepassword
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token/password
        metadataPolicy: None
        conversionStrategy: Default
        decodingStrategy: None
        nullBytePolicy: Ignore
