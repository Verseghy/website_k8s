# refreshInterval: ESO checks this store again 3600 seconds after a successful
# check instead of every 5 minutes. With ESO 0.20.4 each check lists the
# 1Password vaults twice, and 1Password caps an account's requests per day.
# A failing check is still retried within 7 minutes. The edge's other store,
# verseghy-website/eso/secretstore.yaml, uses the same value and explains it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  namespace: cert-manager
spec:
  refreshInterval: 3600
  provider:
    onepasswordSDK:
      vault: Verseghy
      auth:
        serviceAccountSecretRef:
          name: onepassword-connect-token-verseghy
          key: token
