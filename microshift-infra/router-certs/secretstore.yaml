# refreshInterval: ESO checks this store again 3600 seconds after a successful
# check instead of every 5 minutes. With ESO 2.5.0 a check makes no 1Password
# request (the controller reuses its cached client for the store), so the
# value only cuts the store's status patch requests and events on the edge.
# A Ready store stays Ready even when its token or 1Password fails, and after
# a token rotation the ESO controller needs a restart. The edge's other store,
# verseghy-website/eso/secretstore.yaml, uses the same value and explains it.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword
  namespace: cert-manager
spec:
  refreshInterval: 3600
  provider:
    onepasswordSDK:
      vault: Verseghy
      auth:
        serviceAccountSecretRef:
          name: onepassword-connect-token-verseghy
          key: token
